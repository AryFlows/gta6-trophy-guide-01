<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frost Trophy Guide — GTA 6 platinum tracker</title>
<meta name="description" content="Offline guide and tracker for all 55 GTA 6 PlayStation 5 trophies: checklist, roadmap to the platinum, the one missable trophy flagged, and a cited guide for each trophy.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="eyebrow">Grand Theft Auto VI · PlayStation 5 · 55 trophies</div>
    <h1>Frost Trophy Guide</h1>
    <p class="tagline">Checklist, roadmap, missable flags and a cited guide for each of the 55 trophies.</p>
  </div>
  <div class="hud" aria-label="Platinum progress">
    <div class="hud-big"><span id="earnedCount">0</span> / 55 earned · <span id="earnedPct">0%</span></div>
    <div class="progress" id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="55" aria-valuenow="0" aria-label="Trophies earned"><div id="progressFill" class="progress-fill"></div></div>
    <div id="gradeCounts" class="hud-grades"></div>
    <div id="psnPoints" class="hud-points"></div>
  </div>
</header>

<div id="auditStrip" class="audit-strip" aria-label="Audit against the official list"></div>

<aside class="judge-box"><span id="judgeNote"></span></aside>

<section id="missableBanner" aria-label="Missable trophies"></section>

<section class="toolbar" aria-label="Search, filter and file actions">
  <input id="searchBox" type="search" placeholder="Search a trophy name or guide…" aria-label="Search trophies">
  <div id="filterChips" class="chips" role="group" aria-label="Filter by kind"></div>
  <label class="spoiler-toggle"><input id="spoilerToggle" type="checkbox"> Hide story spoilers</label>
  <div class="file-actions">
    <button id="exportBtn" type="button">Export progress</button>
    <button id="importBtn" type="button">Import progress</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
    <button id="resetBtn" type="button">Reset</button>
  </div>
</section>

<main class="layout">
  <section class="col-list" aria-label="Trophy checklist">
    <h2>Trophy checklist</h2>
    <p id="listNote" class="list-note"></p>
    <ul id="trophyList" class="trophy-list"></ul>
  </section>

  <section class="col-guide" id="guideDetail" aria-label="Trophy guide"></section>

  <aside class="col-side">
    <section class="side-box" aria-label="Next up">
      <h2>Next up · roadmap order</h2>
      <div id="nextUp"></div>
    </section>
    <section class="side-box" aria-label="Count trackers">
      <h2>Count trackers</h2>
      <div id="countTrackers"></div>
    </section>
  </aside>
</main>

<section id="roadmapBox" class="roadmap" aria-label="Roadmap to the platinum"></section>

<section id="sourcesBox" class="sources" aria-label="Sources"></section>

<pre id="selftest" hidden></pre>

<script type="module" src="src/main.js"></script>
<script type="module" src="src/official-list-audit.js"></script>
<script type="module" src="src/next-up-planner.js"></script>
<script type="module" src="src/count-tracker.js"></script>
</body>
</html>
